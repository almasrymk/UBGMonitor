name: MonitorAgent CI

on:
  pull_request:
  push:
    branches:
      - 'security/**'
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore MonitorAgent.sln
      - name: Build Release
        run: dotnet build MonitorAgent.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test MonitorAgent.sln -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Publish service for distribution checks
        run: dotnet publish src/MonitorAgent.Service/MonitorAgent.Service.csproj -c Release --no-restore -o artifacts/ci-service
      - name: Check published settings for secrets and installation data
        shell: pwsh
        run: ./scripts/check-release-secrets.ps1 -PublishPath artifacts/ci-service
      - name: Verify release scanner rejects synthetic secrets
        shell: pwsh
        run: ./scripts/test-release-secrets.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Scan commit range for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan PR or push range with redacted output
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA"
          elif [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="-1 $HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --log-opts="$range" --redact=100 --no-banner
